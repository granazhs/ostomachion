<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title data-i18nkey="title">Ostomachion</title>
    <script>
     const is_embedded = false;
    </script>
    <script src="assets/jquery.js"></script>
    <script src="assets/i18n.js"></script>
    <script src="assets/view.js"></script>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div id="i18nbox" onclick="i18n_showsel()" onmouseover="i18n_showsel()" onmouseout="i18n_hidesel()">
        <div id="i18ncur"><img src="assets/flag_en.png" id="i18nflag" title="Select language"></div>
        <div id="i18nsel" style="display: none">
            <button onclick="window.translate('en')"><img src="assets/flag_en.png" alt="en"></button>
            <button onclick="window.translate('gr')"><img src="assets/flag_gr.png" alt="gr"></button>
            <button onclick="window.translate('de')"><img src="assets/flag_de.png" alt="de"></button>
            <button onclick="window.translate('fr')"><img src="assets/flag_fr.png" alt="fr"></button>
            <button onclick="window.translate('it')"><img src="assets/flag_it.png" alt="it"></button>
            <button onclick="window.translate('es')"><img src="assets/flag_es.png" alt="es"></button>
            <button onclick="window.translate('zh')"><img src="assets/flag_zh.png" alt="zh"></button>
            <button onclick="window.translate('ru')"><img src="assets/flag_ru.png" alt="ru"></button>
            <button onclick="window.translate('ja')"><img src="assets/flag_ja.png" alt="ja"></button>
        </div>
    </div>
    <canvas id="canvas" width="1280" height="900"></canvas>
    <div id="controls">
        <h1 data-i18nkey="title">Ostomachion</h1>
        <p id="instr" data-i18nkey="instr"></p>
        <button id="rotate-button" data-i18nkey="rotate">Rotate</button>
        <button id="flip-button" data-i18nkey="flip">Flip</button>
        <button id="reset-button" data-i18nkey="reset">Reset</button>
        <p id="status"></p>
        <p id="credit" data-i18nkey="credit"></p>
    </div>
</body>
</html>
